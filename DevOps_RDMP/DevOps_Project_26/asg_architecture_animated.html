<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS ASG Architecture - Animated</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(255,153,0,0.5);
        }
        
        .architecture {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }
        
        /* AWS Cloud */
        .aws-cloud {
            background: linear-gradient(145deg, #232f3e 0%, #1a2332 100%);
            border: 2px solid #ff9900;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(255,153,0,0.3);
        }
        
        .aws-cloud::before {
            content: 'AWS Cloud';
            position: absolute;
            top: -12px;
            left: 20px;
            background: #ff9900;
            color: #232f3e;
            padding: 4px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        
        /* Users */
        .users {
            text-align: center;
            margin-bottom: 5px;
            animation: pulse 2s infinite;
        }
        
        .users img, .icon {
            width: 50px;
            height: 50px;
        }
        
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #3498db;
            border-radius: 10px;
            color: white;
            font-size: 24px;
        }
        
        .users-label {
            color: #fff;
            margin-top: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        
        /* Traffic Flow Animation */
        .traffic-flow {
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .packet {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            position: absolute;
            animation: flowDown 1.5s infinite;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .packet:nth-child(2) { animation-delay: 0.5s; }
        .packet:nth-child(3) { animation-delay: 1s; }
        
        @keyframes flowDown {
            0% { top: 0; opacity: 1; }
            100% { top: 20px; opacity: 0; }
        }
        
        /* VPC */
        .vpc {
            background: linear-gradient(145deg, #1e3a5f 0%, #152a45 100%);
            border: 2px dashed #3498db;
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }
        
        .vpc::before {
            content: 'VPC';
            position: absolute;
            top: -12px;
            left: 15px;
            background: #3498db;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* Internet Gateway */
        .igw {
            background: linear-gradient(145deg, #8e44ad, #6c3483);
            padding: 10px 25px;
            border-radius: 8px;
            text-align: center;
            margin: 10px auto;
            width: fit-content;
            color: white;
            font-weight: bold;
            font-size: 14px;
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 10px #8e44ad; }
            to { box-shadow: 0 0 30px #8e44ad, 0 0 60px #8e44ad; }
        }
        
        /* Availability Zones */
        .az-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        
        .az {
            background: rgba(255,255,255,0.05);
            border: 2px solid #555;
            border-radius: 10px;
            padding: 12px;
            position: relative;
        }
        
        .az::before {
            content: attr(data-az);
            position: absolute;
            top: -10px;
            left: 12px;
            background: #555;
            color: white;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 11px;
        }
        
        /* Subnets */
        .subnet {
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            position: relative;
        }
        
        .subnet::before {
            content: attr(data-subnet);
            font-size: 11px;
            color: rgba(255,255,255,0.9);
            position: absolute;
            top: 4px;
            left: 8px;
        }
        
        .public-subnet {
            background: linear-gradient(145deg, #27ae60, #1e8449);
            border: 1px solid #2ecc71;
        }
        
        .private-subnet {
            background: linear-gradient(145deg, #d35400, #a04000);
            border: 1px solid #e67e22;
        }
        
        /* ALB */
        .alb {
            background: linear-gradient(145deg, #9b59b6, #7d3c98);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            margin: 10px auto;
            width: 60%;
            animation: loadBalance 2s infinite;
        }
        
        @keyframes loadBalance {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        /* NAT Gateway */
        .nat-gw {
            background: linear-gradient(145deg, #f39c12, #d68910);
            padding: 8px 15px;
            border-radius: 6px;
            text-align: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: fit-content;
            margin: 8px auto;
        }
        
        /* Target Group */
        .target-group {
            border: 2px dashed #9b59b6;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            position: relative;
        }
        
        .target-group::before {
            content: 'Target Group';
            position: absolute;
            top: -10px;
            left: 10px;
            background: #9b59b6;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
        }
        
        /* ASG */
        .asg {
            border: 2px dashed #f1c40f;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            position: relative;
            animation: scaleGroup 4s infinite;
        }
        
        .asg::before {
            content: 'Auto Scaling Group';
            position: absolute;
            top: -10px;
            left: 10px;
            background: #f1c40f;
            color: #232f3e;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        
        @keyframes scaleGroup {
            0%, 100% { border-color: #f1c40f; }
            50% { border-color: #2ecc71; box-shadow: 0 0 20px rgba(46,204,113,0.3); }
        }
        
        /* EC2 Instances */
        .instances {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 0;
        }
        
        .ec2 {
            background: linear-gradient(145deg, #e67e22, #d35400);
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
            animation: instancePulse 2s infinite;
            position: relative;
        }
        
        .ec2:nth-child(1) { animation-delay: 0s; }
        .ec2:nth-child(2) { animation-delay: 0.3s; }
        .ec2:nth-child(3) { animation-delay: 0.6s; }
        .ec2:nth-child(4) { animation-delay: 0.9s; }
        
        .ec2.scaling-in {
            animation: scaleIn 2s forwards;
        }
        
        .ec2.scaling-out {
            animation: scaleOut 2s forwards;
        }
        
        @keyframes instancePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(230,126,34,0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(230,126,34,0.8); }
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes scaleOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .ec2-icon {
            font-size: 22px;
            margin-bottom: 3px;
        }
        
        /* AMI */
        .ami {
            background: linear-gradient(145deg, #3498db, #2980b9);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            margin: 15px auto;
            width: fit-content;
            animation: amiGlow 3s infinite;
        }
        
        @keyframes amiGlow {
            0%, 100% { box-shadow: 0 0 10px #3498db; }
            50% { box-shadow: 0 0 30px #3498db; }
        }
        
        /* Scaling Controls */
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        
        .btn {
            background: linear-gradient(145deg, #ff9900, #e68a00);
            border: none;
            color: #232f3e;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,153,0,0.5);
        }
        
        .btn-danger {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }
        
        /* Metrics */
        .metrics {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .metric {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            min-width: 100px;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
        }
        
        .metric-label {
            color: #aaa;
            font-size: 12px;
            margin-top: 5px;
        }
        
        /* Traffic Lines */
        .traffic-line {
            height: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .traffic-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            animation: trafficMove 0.8s infinite linear;
            box-shadow: 0 0 5px #00ff88;
        }
        
        .traffic-dot:nth-child(2) { animation-delay: 0.33s; }
        .traffic-dot:nth-child(3) { animation-delay: 0.66s; }
        
        @keyframes trafficMove {
            0% { top: 0; opacity: 1; }
            100% { top: 100%; opacity: 0.3; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            font-size: 12px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        
        .legend-public {
            background: #27ae60;
        }
        
        .legend-private {
            background: #d35400;
        }
        
        .legend-ec2 {
            background: #e67e22;
        }
        
        .legend-asg {
            background: #f1c40f;
        }
        
        .spacer {
            height: 25px;
        }
    </style>
</head>
<body>
    <h1>🚀 AWS Auto Scaling Group</h1>
    
    <div class="architecture">
        <!-- Users -->
        <div class="users">
            <div class="icon">👥</div>
            <div class="users-label">Users</div>
        </div>
        
        <!-- Traffic Flow -->
        <div class="traffic-flow">
            <div class="packet"></div>
            <div class="packet"></div>
            <div class="packet"></div>
        </div>
        
        <!-- AWS Cloud -->
        <div class="aws-cloud">
            <!-- Internet Gateway -->
            <div class="igw">🌐 IGW</div>
            
            <div class="traffic-line">
                <div class="traffic-dot"></div>
                <div class="traffic-dot"></div>
                <div class="traffic-dot"></div>
            </div>
            
            <!-- VPC -->
            <div class="vpc">
                <!-- ALB in Public Subnet Area -->
                <div class="alb">⚖️ ALB</div>
                
                <div class="traffic-line">
                    <div class="traffic-dot"></div>
                    <div class="traffic-dot"></div>
                    <div class="traffic-dot"></div>
                </div>
                
                <!-- Availability Zones -->
                <div class="az-container">
                    <!-- AZ 1 -->
                    <div class="az" data-az="AZ-1">
                        <div class="subnet public-subnet" data-subnet="Public">
                            <div class="nat-gw">🔀 NAT</div>
                        </div>
                        <div class="subnet private-subnet" data-subnet="Private">
                            <div class="target-group">
                                <div class="asg">
                                    <div class="instances" id="instances-az1">
                                        <div class="ec2">
                                            <span class="ec2-icon">💻</span>
                                            EC2
                                        </div>
                                        <div class="ec2">
                                            <span class="ec2-icon">💻</span>
                                            EC2
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- AZ 2 -->
                    <div class="az" data-az="AZ-2">
                        <div class="subnet public-subnet" data-subnet="Public">
                            <div class="spacer"></div>
                        </div>
                        <div class="subnet private-subnet" data-subnet="Private">
                            <div class="target-group">
                                <div class="asg">
                                    <div class="instances" id="instances-az2">
                                        <div class="ec2">
                                            <span class="ec2-icon">💻</span>
                                            EC2
                                        </div>
                                        <div class="ec2">
                                            <span class="ec2-icon">💻</span>
                                            EC2
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- AMI / Launch Template -->
                <div class="ami">📀 AMI</div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button class="btn" onclick="scaleOut()">📈 Scale Out</button>
            <button class="btn btn-danger" onclick="scaleIn()">📉 Scale In</button>
            <button class="btn" onclick="simulateTraffic()">🔄 Simulate</button>
        </div>
        
        <!-- Metrics -->
        <div class="metrics">
            <div class="metric">
                <div class="metric-value" id="instance-count">4</div>
                <div class="metric-label">Instances</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="cpu-usage">45%</div>
                <div class="metric-label">CPU</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="requests">1.2K</div>
                <div class="metric-label">Req/min</div>
            </div>
        </div>
        
        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color legend-public"></div>
                Public
            </div>
            <div class="legend-item">
                <div class="legend-color legend-private"></div>
                Private
            </div>
            <div class="legend-item">
                <div class="legend-color legend-ec2"></div>
                EC2
            </div>
            <div class="legend-item">
                <div class="legend-color legend-asg"></div>
                ASG
            </div>
        </div>
    </div>
    
    <script>
        let instanceCount = 4;
        const maxInstances = 8;
        const minInstances = 2;
        
        function updateMetrics() {
            document.getElementById('instance-count').textContent = instanceCount;
        }
        
        function scaleOut() {
            if (instanceCount >= maxInstances) {
                alert('Maximum capacity reached (8 instances)');
                return;
            }
            
            const az = instanceCount % 2 === 0 ? 'az1' : 'az2';
            const container = document.getElementById(`instances-${az}`);
            
            const newInstance = document.createElement('div');
            newInstance.className = 'ec2 scaling-in';
            newInstance.innerHTML = '<span class="ec2-icon">💻</span>EC2';
            container.appendChild(newInstance);
            
            instanceCount++;
            updateMetrics();
            
            // Update CPU
            const cpu = Math.max(30, 80 - (instanceCount * 5));
            document.getElementById('cpu-usage').textContent = cpu + '%';
        }
        
        function scaleIn() {
            if (instanceCount <= minInstances) {
                alert('Minimum capacity reached (2 instances)');
                return;
            }
            
            const az1 = document.getElementById('instances-az1');
            const az2 = document.getElementById('instances-az2');
            
            let container = az1.children.length >= az2.children.length ? az1 : az2;
            
            if (container.lastChild) {
                container.lastChild.classList.add('scaling-out');
                setTimeout(() => {
                    if (container.lastChild) {
                        container.removeChild(container.lastChild);
                    }
                }, 500);
            }
            
            instanceCount--;
            updateMetrics();
            
            // Update CPU
            const cpu = Math.min(90, 80 - (instanceCount * 5) + 20);
            document.getElementById('cpu-usage').textContent = cpu + '%';
        }
        
        function simulateTraffic() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Simulating...';
            
            // Increase requests
            document.getElementById('requests').textContent = '5.8K';
            document.getElementById('cpu-usage').textContent = '85%';
            
            // Auto scale out
            setTimeout(() => scaleOut(), 1000);
            setTimeout(() => scaleOut(), 2000);
            setTimeout(() => scaleOut(), 3000);
            
            // Return to normal
            setTimeout(() => {
                document.getElementById('requests').textContent = '1.2K';
                document.getElementById('cpu-usage').textContent = '45%';
                btn.disabled = false;
                btn.textContent = '🔄 Simulate High Traffic';
            }, 5000);
        }
        
        // Animate metrics periodically
        setInterval(() => {
            const requests = 1000 + Math.floor(Math.random() * 500);
            document.getElementById('requests').textContent = (requests / 1000).toFixed(1) + 'K';
        }, 3000);
    </script>
</body>
</html>
