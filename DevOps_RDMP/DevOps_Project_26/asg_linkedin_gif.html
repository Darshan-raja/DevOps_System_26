<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AWS Auto Scaling</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,153,0,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59,130,246,0.08) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        
        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* Grid overlay */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }
        
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Title */
        .title {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }
        
        .title .aws {
            background: linear-gradient(135deg, #ff9900, #ffb84d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .title .subtitle {
            color: #94a3b8;
            font-weight: 600;
        }
        
        /* Flow container */
        .flow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        /* Components */
        .component {
            background: linear-gradient(135deg, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.9) 100%);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .component:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .component-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .users-icon { 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }
        .igw-icon { 
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }
        .alb-icon { 
            background: linear-gradient(135deg, #ec4899, #be185d);
        }
        
        /* Traffic animation */
        .traffic-line {
            width: 4px;
            height: 35px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        
        .traffic-dot {
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            position: absolute;
            left: -3px;
            animation: trafficFlow 0.7s infinite linear;
            box-shadow: 0 0 15px #10b981, 0 0 30px rgba(16,185,129,0.5);
        }
        
        .traffic-dot:nth-child(2) { animation-delay: 0.23s; }
        .traffic-dot:nth-child(3) { animation-delay: 0.46s; }
        
        @keyframes trafficFlow {
            0% { top: -10px; opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { top: 35px; opacity: 0; transform: scale(0.5); }
        }
        
        /* VPC Container */
        .vpc-container {
            background: linear-gradient(135deg, rgba(30,58,138,0.3) 0%, rgba(30,64,175,0.1) 100%);
            border: 2px solid rgba(59,130,246,0.3);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            margin-top: 5px;
        }
        
        .vpc-label {
            position: absolute;
            top: -11px;
            left: 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            padding: 4px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
        }
        
        /* ASG Box */
        .asg-container {
            background: linear-gradient(135deg, rgba(30,41,59,0.95) 0%, rgba(15,23,42,0.95) 100%);
            border: 2px solid;
            border-image: linear-gradient(135deg, #f59e0b, #d97706) 1;
            border-radius: 16px;
            padding: 18px 25px;
            position: relative;
            box-shadow: 0 0 30px rgba(245,158,11,0.2);
            transition: all 0.5s ease;
        }
        
        .asg-container.scaling {
            box-shadow: 0 0 40px rgba(245,158,11,0.4);
            border-image: linear-gradient(135deg, #10b981, #059669) 1;
        }
        
        .asg-label {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            padding: 5px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(245,158,11,0.4);
            white-space: nowrap;
        }
        
        .instances-row {
            display: flex;
            gap: 12px;
            padding: 15px 10px 10px;
            min-height: 95px;
            align-items: center;
            justify-content: center;
        }
        
        .ec2 {
            width: 65px;
            height: 75px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 10px;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
            animation: ec2Float 3s ease-in-out infinite;
            letter-spacing: 0.5px;
        }
        
        .ec2:nth-child(1) { animation-delay: 0s; }
        .ec2:nth-child(2) { animation-delay: 0.4s; }
        .ec2:nth-child(3) { animation-delay: 0.8s; }
        .ec2:nth-child(4) { animation-delay: 1.2s; }
        .ec2:nth-child(5) { animation-delay: 1.6s; }
        
        @keyframes ec2Float {
            0%, 100% { 
                transform: translateY(0); 
                box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
            }
            50% { 
                transform: translateY(-5px); 
                box-shadow: 0 8px 30px rgba(249, 115, 22, 0.6);
            }
        }
        
        .ec2-icon {
            font-size: 26px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .ec2.new {
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        
        /* Metrics bar */
        .metrics-bar {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }
        
        .metric {
            text-align: center;
            background: rgba(255,255,255,0.03);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            min-width: 90px;
            transition: all 0.3s ease;
        }
        
        .metric-value {
            font-size: 28px;
            font-weight: 800;
            color: #10b981;
            line-height: 1;
            transition: all 0.3s ease;
        }
        
        .metric-value.warning { color: #f59e0b; }
        .metric-value.danger { color: #ef4444; text-shadow: 0 0 20px rgba(239,68,68,0.5); }
        
        .metric-label {
            color: #64748b;
            font-size: 11px;
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        /* Status badge */
        .status {
            position: absolute;
            top: 18px;
            right: 18px;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .status.running {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 20px rgba(16,185,129,0.2);
        }
        
        .status.scaling {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 25px rgba(245,158,11,0.3);
            animation: statusPulse 0.8s infinite;
        }
        
        @keyframes statusPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: dotPulse 1.5s infinite;
        }
        
        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        /* Watermark */
        .watermark {
            position: absolute;
            bottom: 12px;
            right: 18px;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 10;
        }
        
        /* AWS Badge */
        .aws-badge {
            position: absolute;
            top: 18px;
            left: 18px;
            background: linear-gradient(135deg, #ff9900, #ffb84d);
            color: #000;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255,153,0,0.4);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="aws-badge">AWS</div>
    
    <div class="status running" id="status">
        <div class="status-dot"></div>
        <span id="status-text">Running</span>
    </div>
    
    <div class="main-container">
        <div class="title">
            <span>⚡</span> 
            <span class="aws">Auto Scaling</span>
            <span class="subtitle">in Action</span>
        </div>
        
        <div class="flow">
            <!-- Users -->
            <div class="component">
                <div class="component-icon users-icon">👥</div>
                <span>Users / Traffic</span>
            </div>
            
            <!-- Traffic Line 1 -->
            <div class="traffic-line">
                <div class="traffic-dot"></div>
                <div class="traffic-dot"></div>
                <div class="traffic-dot"></div>
            </div>
            
            <!-- Internet Gateway -->
            <div class="component">
                <div class="component-icon igw-icon">🌐</div>
                <span>Internet Gateway</span>
            </div>
            
            <!-- Traffic Line 2 -->
            <div class="traffic-line">
                <div class="traffic-dot"></div>
                <div class="traffic-dot"></div>
                <div class="traffic-dot"></div>
            </div>
            
            <!-- VPC -->
            <div class="vpc-container">
                <div class="vpc-label">VPC</div>
                
                <!-- ALB -->
                <div class="component" style="margin-bottom: 12px;">
                    <div class="component-icon alb-icon">⚖️</div>
                    <span>Load Balancer</span>
                </div>
                
                <!-- Traffic Line 3 -->
                <div class="traffic-line" style="margin: 0 auto;">
                    <div class="traffic-dot"></div>
                    <div class="traffic-dot"></div>
                    <div class="traffic-dot"></div>
                </div>
                
                <!-- ASG -->
                <div class="asg-container" id="asg-box" style="margin-top: 12px;">
                    <div class="asg-label">AUTO SCALING GROUP</div>
                    <div class="instances-row" id="instances">
                        <div class="ec2">
                            <span class="ec2-icon">🖥️</span>
                            EC2
                        </div>
                        <div class="ec2">
                            <span class="ec2-icon">🖥️</span>
                            EC2
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Metrics -->
        <div class="metrics-bar">
            <div class="metric">
                <div class="metric-value" id="instances-count">2</div>
                <div class="metric-label">INSTANCES</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="cpu">42%</div>
                <div class="metric-label">CPU</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="requests">1.5K</div>
                <div class="metric-label">REQ/MIN</div>
            </div>
        </div>
    </div>
    
    <div class="watermark">@Darshan-raja</div>
    
    <script>
        const instances = document.getElementById('instances');
        const countEl = document.getElementById('instances-count');
        const cpuEl = document.getElementById('cpu');
        const reqEl = document.getElementById('requests');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const asgBox = document.getElementById('asg-box');
        
        let count = 2;
        
        function setStatus(type, text) {
            statusEl.className = 'status ' + type;
            statusText.textContent = text;
            
            if (type === 'scaling') {
                asgBox.classList.add('scaling');
            } else {
                asgBox.classList.remove('scaling');
            }
        }
        
        function setCPU(val, level) {
            cpuEl.textContent = val;
            cpuEl.className = 'metric-value ' + level;
        }
        
        function addInstance() {
            const ec2 = document.createElement('div');
            ec2.className = 'ec2 new';
            ec2.innerHTML = '<span class="ec2-icon">🖥️</span>EC2';
            instances.appendChild(ec2);
            count++;
            countEl.textContent = count;
        }
        
        function runAnimation() {
            // Phase 1: Normal operation
            setStatus('running', 'Running');
            setCPU('42%', '');
            reqEl.textContent = '1.5K';
            
            // Phase 2: Traffic starts increasing
            setTimeout(() => {
                setCPU('65%', 'warning');
                reqEl.textContent = '3.2K';
            }, 1500);
            
            // Phase 3: High traffic - trigger scaling
            setTimeout(() => {
                setCPU('87%', 'danger');
                reqEl.textContent = '5.8K';
                setStatus('scaling', 'Scaling Out...');
            }, 2800);
            
            // Phase 4: Add instances one by one
            setTimeout(() => addInstance(), 3800);
            setTimeout(() => addInstance(), 4600);
            setTimeout(() => addInstance(), 5400);
            
            // Phase 5: Stabilized
            setTimeout(() => {
                setCPU('52%', '');
                reqEl.textContent = '5.5K';
                setStatus('running', 'Scaled ✓');
            }, 6500);
        }
        
        // Start animation
        runAnimation();
        
        // Loop every 8.5 seconds
        setInterval(() => {
            instances.innerHTML = `
                <div class="ec2"><span class="ec2-icon">🖥️</span>EC2</div>
                <div class="ec2"><span class="ec2-icon">🖥️</span>EC2</div>
            `;
            count = 2;
            countEl.textContent = count;
            runAnimation();
        }, 8500);
    </script>
</body>
</html>
